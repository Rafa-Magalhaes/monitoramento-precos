spring:
  application:
    name: monitoramento-precos
  profiles:
    active: dev

api:
  whatsapp:
    cloud:
      url: https://graph.facebook.com/v19.0
      phone-number-id: ${WHATSAPP_PHONE_ID:1234567890}
      access-token: ${WHATSAPP_TOKEN:token_provisorio}

  brightdata:
    host: ${BRIGHTDATA_HOST}
    port: ${BRIGHTDATA_PORT}
    username: ${BRIGHTDATA_USERNAME}
    password: ${BRIGHTDATA_PASSWORD}

server:
  port: 8085